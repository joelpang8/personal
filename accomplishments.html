<script src="content.js"></script>
<script>
(function () {
  // one ink timeline, newest year first; press and collections join it once they have real entries
  const A = SITE.accomplishments;
  const real = (s) => s && !String(s).includes("[");
  const items = [
    ...A.exhibitions.map((e) => ({ year: e.year, kind: "Exhibition", title: e.title, sub: e.place })),
    ...A.awards.map((a) => ({ year: a.year, kind: "Award", title: a.title, sub: a.org })),
    ...(A.press || []).filter((p) => real(p.title)).map((p) => ({ year: p.year, kind: "Press", title: p.title, sub: p.outlet })),
  ];
  const years = [...new Set(items.map((i) => i.year))].sort((a, b) => b - a);
  document.getElementById("timeline").innerHTML = years.map((y) => `
    <li class="tl-year">
      <span class="tl-year-num">${y}</span>
      <ul class="tl-items">${items.filter((i) => i.year === y).map((i) => `
        <li class="tl-item" data-kind="${i.kind.toLowerCase()}">
          <span class="tl-kind">${i.kind}</span>
          <span class="tl-title">${i.title}</span>
          <span class="tl-sub">${i.sub}</span>
        </li>`).join("")}
      </ul>
    </li>`).join("");
})();
</script>
<script src="script.js"></script>
<script src="pages.js"></script>
</body>
