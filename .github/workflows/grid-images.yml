# When photos are added or replaced in images/, make the smaller copies the year-page cards use (images/grid/).
name: Grid images
on:
  push:
    branches: [master]
    paths: ["images/*.jpg", "images/*.jpeg", ".github/scripts/make_grid.py"]
permissions:
  contents: write
jobs:
  grid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Make grid copies
        run: |
          changed=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- 'images/*.jpg' 'images/*.jpeg' 2>/dev/null || true)
          python .github/scripts/make_grid.py $changed
      - name: Commit new copies
        run: |
          git add images/grid
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Make grid copies of new photos"
          git push
