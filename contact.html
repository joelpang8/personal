<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Contact — Joel Pang</title>
<meta name="description" content="Get in touch with Joel Pang about commissions, studio visits, or exhibitions." />
<link rel="stylesheet" href="style.css?v=0813c8e" />
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48" />
<link rel="icon" href="favicon-64.png" type="image/png" sizes="64x64" />
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="theme-color" content="#faf9f6" />
<!-- link previews (texts, Instagram, email, social) -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Joel Pang" />
<meta property="og:title" content="Contact — Joel Pang" />
<meta property="og:description" content="Commissions, studio visits, exhibitions, or press — get in touch with Joel Pang." />
<meta property="og:url" content="https://joelpang.com/contact" />
<meta property="og:image" content="https://joelpang.com/images/og-image.jpg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="Joel Pang — Jukebox, oil and ink on canvas" />
<meta name="twitter:card" content="summary_large_image" />
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="./">Joel Pang</a>
    <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false"><span></span></button>
    <nav class="main-nav">
      <ul>
        <li><a href="./">Work</a></li>
        <li><a href="about">About</a></li>
        <li><a href="accomplishments">Accomplishments</a></li>
        <li><a href="contact" aria-current="page">Contact</a></li>
      </ul>
    </nav>
  </div>
</header>

<main>
  <section class="contact-band" id="contact-band">
    <div class="contact-stage" aria-hidden="true"></div>
    <div class="wrap contact-inner">
      <p class="eyebrow">Contact</p>
      <h1>Get in touch</h1>
      <p class="contact-lead">Commissions, studio visits, exhibitions, or press.</p>
      <div class="contact-email-row">
        <a id="email-link" class="contact-email" href="#"></a>
        <button type="button" class="copy-btn" id="copy-email">Copy</button>
      </div>
      <a id="instagram-link" class="contact-ig" href="#" hidden></a>
      <p class="contact-note">Based in Madison, WI &middot; Replies within a few days</p>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <span>&copy; <span id="year"></span> Joel Pang</span>
    <span class="footer-contact"><!-- email and Instagram, filled in by script.js from content.js --></span>
  </div>
</footer>

<script src="content.js?v=0813c8e"></script>
<script>
(function () {
  const emailLink = document.getElementById("email-link");
  emailLink.href = "mailto:" + SITE.email;
  emailLink.textContent = SITE.email;
  const btn = document.getElementById("copy-email");
  btn.addEventListener("click", () => {
    const done = () => { btn.textContent = "Copied"; setTimeout(() => (btn.textContent = "Copy"), 1800); };
    const fallback = () => {   // select the address so it can be copied by hand
      const r = document.createRange(); r.selectNodeContents(emailLink);
      const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    };
    if (navigator.clipboard) navigator.clipboard.writeText(SITE.email).then(done, fallback); else fallback();
  });
  if (SITE.instagram) {
    const ig = document.getElementById("instagram-link");
    ig.href = SITE.instagram; ig.textContent = SITE.instagramHandle + " on Instagram";
    ig.target = "_blank"; ig.rel = "noopener"; ig.hidden = false;
  }
})();
</script>
<script src="script.js?v=0813c8e"></script>
<script src="pages.js?v=0813c8e"></script>
</body>
</html>
